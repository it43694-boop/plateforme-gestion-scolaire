{% extends "base.html" %}
{% block titre %}Statistiques{% endblock %}
{% block contenu %}
<div class="row">
    <div class="col-md-3">
        <div class="card mb-3">
            <div class="card-body mini-stat">
                <form method="get" class="mb-3">
                    <label class="form-label filtre-annee-label">Année scolaire</label>
                    <select name="annee" class="form-control filtre-annee-select" data-auto-submit>
                        {% for a in toutes_annees %}
                        <option value="{{ a.id }}" {% if annee.id == a.id %}selected{% endif %}>{{ a.libelle }}</option>
                        {% endfor %}
                    </select>
                </form>
                <div class="list-group list-group-flush">
                    <a href="{% url 'statistiques:vue_ensemble' %}?annee={{ annee.id }}"
                       class="nav-lien-stats{% if actif == 'ensemble' %} actif{% endif %}">
                        Statistique globale
                    </a>
                    {% for c in classes %}
                    <a href="{% url 'statistiques:statistiques_classe' c.id %}"
                       class="nav-lien-stats{% if classe.id == c.id %} actif{% endif %}">
                        {{ c.nom }}
                    </a>
                    {% endfor %}
                    <a href="{% url 'statistiques:statistiques_finances' %}?annee={{ annee.id }}"
                       class="nav-lien-stats{% if actif == 'finances' %} actif{% endif %}">
                        Finances
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-9">
        {% block contenu_stats %}{% endblock %}
    </div>
</div>
{% endblock %}
