<!DOCTYPE html>
{% load static %}
<html lang="{{ LANGUAGE_CODE|default:'fr' }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ nom_plateforme }}</title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <meta name="theme-color" content="#12203D">
    {% include "partials/feuilles_de_style.html" %}
</head>
<body class="corps-page-centree">
<div class="page-langue">{% include "partials/bouton_langue.html" %}</div>
<main class="aucun-etablissement-cadre">
    <img src="{% static 'img/logo-yelenova-embleme.png' %}" alt="" class="aucun-etablissement-logo">
    <h1 class="aucun-etablissement-titre">{{ nom_commercial }}</h1>
    <p class="aucun-etablissement-texte">
        Aucun établissement n'est encore configuré sur cette installation.
    </p>
    <a href="{% url 'comptes:connexion' %}" class="btn-hero-secondaire d-inline-block">
        Se connecter avec un compte propriétaire de la plateforme
    </a>
</main>
</body>
</html>
