{% if figure.vide %}<p class="graphique-vide">Pas encore de donnée.</p>{% else %}
<ul class="graphique graphique-barres" aria-label="{{ titre }}">
    {% for ligne in figure.lignes %}
    <li class="barre-ligne">
        <span class="barre-libelle">{{ ligne.libelle }}</span>
        <svg class="barre-svg g-{{ ligne.teinte }}" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect class="barre-fond" x="0" y="0" width="100" height="10"/><rect class="barre-valeur-rect" x="0" y="0" width="{{ ligne.largeur }}" height="10"/></svg>
        <span class="barre-valeur">{{ ligne.texte }}</span>
    </li>
    {% endfor %}
</ul>
{% endif %}
