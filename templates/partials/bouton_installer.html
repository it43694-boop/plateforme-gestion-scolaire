{% load icones %}<button type="button" class="bouton-installer" data-installer hidden>{% icone "telecharger" 16 %}<span class="bouton-installer-texte">Installer l'application</span></button>
<dialog class="installer-aide" id="installer-aide" aria-labelledby="installer-aide-titre">
    <h2 id="installer-aide-titre">Installer l'application</h2>
    <ol>
        <li>Touchez le bouton Partager (le carré avec une flèche vers le haut) de votre navigateur.</li>
        <li>Choisissez « Sur l'écran d'accueil ».</li>
        <li>Touchez Ajouter : l'icône de l'application apparaît avec vos autres applications.</li>
    </ol>
    <form method="dialog"><button type="submit" class="btn btn-primary">Compris</button></form>
</dialog>
