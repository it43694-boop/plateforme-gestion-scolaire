services:
  # Personnalisez le "name" ci-dessous et le domaine dans ALLOWED_HOSTS /
  # CSRF_TRUSTED_ORIGINS / DEFAULT_FROM_EMAIL pour votre propre déploiement.
  # Le nom et le logo affichés dans l'application eux-mêmes se configurent
  # depuis l'espace développeur (/espace-developpeur/etablissement/), pas ici.
  #
  # Déploiement de test à coût nul :
  #   - web + Key-Value (Redis) sur Render, plan "free"
  #   - base de données Postgres sur Supabase (DATABASE_URL à coller dans le
  #     dashboard Render - voir README, section Déploiement gratuit)
  #   - médias (logos, pièces jointes) sur Supabase Storage, compatible S3
  # Limites du plan gratuit Render à connaître : le service web s'endort
  # après 15 min d'inactivité (premier chargement plus lent après une
  # pause) ; le Key-Value gratuit stocke en mémoire uniquement (compteurs de
  # rate-limiting remis à zéro si le service redémarre - acceptable pour un
  # test). Render n'accepte pas le plan gratuit pour les cron jobs : la file
  # d'emails différés et les relances d'impayés automatiques ne sont donc PAS
  # déployées ici (EMAIL_ASYNC=False - les emails partent immédiatement ou
  # échouent, jamais mis en attente indéfiniment). Passez ces "plan:" à
  # "starter" ou plus, et réintroduisez les deux services "cron" ci-dessous
  # (voir git history / README) pour une exploitation réelle.
  - type: web
    name: plateforme-gestion-scolaire
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "toumai-edu-school.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://toumai-edu-school.onrender.com"
      # Chaîne de connexion Postgres Supabase (Project Settings > Database >
      # Connection string > URI). Préférez le "Session pooler" (port 5432,
      # utilisateur postgres.[ref]) à la connexion directe (db.[ref].supabase.co) :
      # cette dernière est IPv6 uniquement et peut ne pas joindre Render.
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: plateforme-gestion-scolaire-redis
          property: connectionString
      # Stockage médias Supabase (Project Settings > Storage > S3 Connection).
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_ASYNC
        value: "False"

  - type: redis
    name: plateforme-gestion-scolaire-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
