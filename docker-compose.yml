# Environnement de développement reproductible (PostgreSQL + Redis réels,
# pas la bascule SQLite/cache mémoire local du "python manage.py runserver"
# nu). Le fichier .env fourni avec le projet est réutilisé pour
# DJANGO_SECRET_KEY ; DATABASE_URL et REDIS_URL sont fixés ci-dessous pour
# pointer vers les services db/redis de ce compose.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "True"
      DATABASE_URL: "postgres://plateforme:plateforme@db:5432/plateforme"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - db
      - redis
    volumes:
      - media_data:/app/media

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plateforme
      POSTGRES_PASSWORD: plateforme
      POSTGRES_DB: plateforme
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  db_data:
  media_data:
